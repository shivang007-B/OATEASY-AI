<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreshFlow AI · CoPayFlow UPI Checkout</title>
  <style>
    :root {
      --ypg-blue: #0b63e5;
      --ypg-blue-dark: #0957cb;
      --ypg-navy: #0b1526;
      --ypg-bg: #f8fafc;
      --ypg-card: #ffffff;
      --ypg-text-dark: #0f172a;
      --ypg-text-muted: #64748b;
      --ypg-border: #e2e8f0;
      --ypg-green: #0d9f67;
      --ypg-green-bg: #e6f9f0;
      --ypg-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ypg-font); -webkit-tap-highlight-color: transparent; }

    body {
      background-color: transparent;
      color: var(--ypg-text-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      font-size: 14px;
    }

    .checkout-card {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow-y: auto;
    }

    @media (min-width: 601px) {
      .checkout-card {
        min-height: 620px;
        max-height: 94vh;
        border-radius: 18px;
        margin: 16px auto;
        border: 1px solid rgba(226, 232, 240, 0.9);
      }
    }

    /* Top Brand Header */
    .header-bar {
      background: linear-gradient(180deg, #0b63e5 0%, #0957cb 100%);
      color: #ffffff;
      padding: 1.25rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #0b63e5;
      font-size: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    .header-titles h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-titles p {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
    }

    .header-close {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #ffffff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.15s;
    }
    .header-close:hover { background: rgba(255, 255, 255, 0.28); }

    /* Amount & Timer Strip */
    .summary-strip {
      background: #f8fafc;
      border-bottom: 1px solid var(--ypg-border);
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .amount-label {
      font-size: 0.75rem;
      color: var(--ypg-text-muted);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .amount-val {
      font-size: 1.6rem;
      font-weight: 900;
      color: #0f172a;
      letter-spacing: -0.03em;
    }

    .timer-badge {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* Checkout Main Content */
    .checkout-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    /* QR Code Display Container */
    .qr-container {
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      padding: 1rem;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .qr-image {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      object-fit: contain;
      background: #ffffff;
    }

    .qr-overlay-brand {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: #0b63e5;
      font-size: 14px;
      pointer-events: none;
    }

    .scan-hint {
      font-size: 0.82rem;
      color: var(--ypg-text-muted);
      margin-top: 0.65rem;
      text-align: center;
      font-weight: 600;
    }

    /* VPA & Copy Box */
    .vpa-box {
      width: 100%;
      background: #f8fafc;
      border: 1px solid var(--ypg-border);
      border-radius: 10px;
      padding: 0.6rem 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
    }

    .vpa-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      font-family: monospace;
      letter-spacing: 0.02em;
    }

    .btn-copy {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0b63e5;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-copy:hover { background: #f1f5f9; }

    /* UPI Apps 1-Tap Strip */
    .upi-apps-label {
      align-self: flex-start;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--ypg-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }

    .upi-apps-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 1.4rem;
    }

    .upi-app-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.65rem 0.35rem;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      text-decoration: none;
      color: #0f172a;
      transition: all 0.15s;
      cursor: pointer;
    }
    .upi-app-btn:hover {
      border-color: #0b63e5;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(11, 99, 229, 0.15);
    }
    .upi-app-btn span {
      font-size: 0.72rem;
      font-weight: 700;
      margin-top: 0.35rem;
    }

    /* Action Buttons */
    .btn-verify-paid {
      width: 100%;
      padding: 0.95rem;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 0 6px 18px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
      margin-bottom: 0.75rem;
    }
    .btn-verify-paid:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(16, 185, 129, 0.45);
    }

    .btn-demo-test {
      background: none;
      border: none;
      color: #0b63e5;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: underline;
      padding: 0.35rem;
    }

    /* Live Observer Indicator */
    .observer-strip {
      margin-top: auto;
      padding: 0.75rem 1.4rem;
      background: #f8fafc;
      border-top: 1px solid var(--ypg-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--ypg-text-muted);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
  </style>
</head>
<body>

  <div class="checkout-card">
    <!-- Top Header -->
    <div class="header-bar">
      <div class="header-left">
        <div class="header-logo">⚡</div>
        <div class="header-titles">
          <h1>CoPayFlow · UPI Checkout</h1>
          <p id="planSubtitle">{{PLAN_NAME}}</p>
        </div>
      </div>
      <button type="button" class="header-close" onclick="closeCheckoutWindow()" title="Close Checkout">✕</button>
    </div>

    <!-- Summary Strip -->
    <div class="summary-strip">
      <div>
        <div class="amount-label">Amount Payable</div>
        <div class="amount-val" id="amountDisplay">₹{{AMOUNT}}</div>
      </div>
      <div class="timer-badge">
        <span>⏱️</span>
        <span id="countdownTimer">04:59</span>
      </div>
    </div>

    <!-- Main QR Section -->
    <div class="checkout-body">
      <div class="qr-container">
        <!-- Dynamic QR Code rendered via QR API / SVG -->
        <img id="qrImage" class="qr-image" alt="UPI QR Code" src="" />
        <div class="qr-overlay-brand">₹</div>
        <p class="scan-hint">Scan with any UPI App (GPay, PhonePe, Paytm, CRED)</p>
      </div>

      <!-- VPA Copy Strip -->
      <div class="vpa-box">
        <div>
          <span style="font-size:0.68rem;color:#64748b;display:block;">UPI VPA ID</span>
          <span class="vpa-text" id="vpaDisplay">freshflow@upi</span>
        </div>
        <button type="button" class="btn-copy" onclick="copyVpa()">Copy VPA</button>
      </div>

      <!-- UPI Apps 1-Tap Trigger -->
      <div class="upi-apps-label">Or Pay Directly with App</div>
      <div class="upi-apps-grid">
        <a id="intentGpay" href="#" class="upi-app-btn">
          <div style="font-size:20px;">🟢</div>
          <span>GPay</span>
        </a>
        <a id="intentPhonePe" href="#" class="upi-app-btn">
          <div style="font-size:20px;">🟣</div>
          <span>PhonePe</span>
        </a>
        <a id="intentPaytm" href="#" class="upi-app-btn">
          <div style="font-size:20px;">🔵</div>
          <span>Paytm</span>
        </a>
        <a id="intentCred" href="#" class="upi-app-btn">
          <div style="font-size:20px;">⚪</div>
          <span>CRED</span>
        </a>
      </div>

      <!-- Action Buttons -->
      <button type="button" class="btn-verify-paid" id="btnVerifyPaid" onclick="confirmPaymentSuccess()">
        <span>✓ I Have Completed Payment</span>
      </button>

      <button type="button" class="btn-demo-test" onclick="confirmPaymentSuccess()">
        ⚡ Instant Verify & Activate (Dev/Demo Mode)
      </button>
    </div>

    <!-- Live Observer Status Bar -->
    <div class="observer-strip">
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="live-dot"></span>
        <span>CoPayFlow Banking Observer: <strong>Active</strong></span>
      </div>
      <div style="font-family:monospace;font-weight:700;" id="orderIdTag">ORD-FF</div>
    </div>
  </div>

  <script>
    // Extract query parameters
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId') || 'FF-' + Date.now().toString().slice(-6);
    const amount = params.get('amount') || '8999';
    const plan = params.get('plan') || 'Pro Kitchen';
    const payeeVpa = params.get('vpa') || 'freshflow@upi';

    // Format display
    document.getElementById('amountDisplay').textContent = '₹' + Number(amount).toLocaleString('en-IN') + '.00';
    document.getElementById('planSubtitle').textContent = 'FreshFlow ' + plan.toUpperCase() + ' Subscription';
    document.getElementById('orderIdTag').textContent = orderId;
    document.getElementById('vpaDisplay').textContent = payeeVpa;

    // Build standard NPCI UPI URI
    const upiUri = `upi://pay?pa=${encodeURIComponent(payeeVpa)}&pn=${encodeURIComponent('FreshFlow AI')}&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent(orderId)}`;

    // Set QR code source using high-reliability dynamic QR generator
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUri)}&margin=10`;
    document.getElementById('qrImage').src = qrUrl;

    // Set UPI app deep-links
    document.getElementById('intentGpay').href = upiUri;
    document.getElementById('intentPhonePe').href = upiUri;
    document.getElementById('intentPaytm').href = upiUri;
    document.getElementById('intentCred').href = upiUri;

    // Countdown Timer
    let secondsLeft = 300;
    const timerEl = document.getElementById('countdownTimer');
    const timerInterval = setInterval(() => {
      secondsLeft--;
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        timerEl.textContent = '00:00';
        return;
      }
      const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
      const secs = String(secondsLeft % 60).padStart(2, '0');
      timerEl.textContent = `${mins}:${secs}`;
    }, 1000);

    function copyVpa() {
      navigator.clipboard.writeText(payeeVpa).then(() => {
        alert('UPI VPA copied to clipboard: ' + payeeVpa);
      }).catch(() => {
        prompt('Copy UPI VPA:', payeeVpa);
      });
    }

    function closeCheckoutWindow() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ event: 'youpi.modal_close' }, '*');
      } else {
        window.history.back();
      }
    }

    function confirmPaymentSuccess() {
      const btn = document.getElementById('btnVerifyPaid');
      btn.disabled = true;
      btn.innerHTML = '<span>Verifying Banking Credit...</span>';

      const mockUtr = 'UTR' + Math.floor(1000000000 + Math.random() * 9000000000);
      const resultData = {
        orderId: orderId,
        order_id: orderId,
        amount: Number(amount),
        amount_received: Number(amount),
        utr: mockUtr,
        bankRef: mockUtr,
        status: 'SUCCESS',
        method: 'UPI'
      };

      // Notify parent modal window (youpi.js standard protocol)
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          event: 'youpi.payment_success',
          status: 'SUCCESS',
          data: resultData
        }, '*');
      }

      // Also trigger authoritative webhook on FreshFlow backend
      fetch('/api/webhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          event: 'SUCCESS',
          orderId: orderId,
          amount: Number(amount),
          utr: mockUtr,
          metadata: { plan: plan }
        })
      }).catch(err => console.warn('Webhook notification note:', err));
    }
  </script>
</body>
</html>
